version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gleb_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Gleb2026Scrb
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - gleb-network
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.role == manager

  backend:
    image: node:20-alpine
    working_dir: /app
    command: >
      sh -c "
      apk add --no-cache git openssl openssl-dev postgresql-client &&
      git clone https://github.com/dihgomes/sistema_gleb.git /app/temp 2>/dev/null || true &&
      if [ -d /app/temp ]; then
        mv /app/temp/* /app/ &&
        rm -rf /app/temp
      fi &&
      cd backend &&
      rm -rf uploads &&
      ln -s /app/uploads uploads &&
      echo 'Aguardando PostgreSQL inicializar...' &&
      until pg_isready -h sistema_gleb_postgres -U postgres; do
        echo 'PostgreSQL não está pronto ainda, aguardando...'
        sleep 2
      done &&
      echo 'PostgreSQL está pronto!' &&
      npm install &&
      npx prisma generate &&
      npx prisma migrate deploy &&
      node scripts/criarAdmin.js || true &&
      node src/server.js
      "
    volumes:
      - uploads-data:/app/uploads
    environment:
      NODE_ENV: production
      PORT: 3002
      API_URL: https://sistema-gleb.scrb.org.br
      DATABASE_URL: postgresql://postgres:Gleb2026Scrb@sistema_gleb_postgres:5432/gleb_db
      JWT_SECRET: 5e0d462036a3f8b0c97cba4517a01dd0a57748b3badbd02827c3a7dc8d0858a8eed70c3e5fa7a69932a9fca655229d735bbf4d74daea91d7a622c0a1474ca72f
      ADMIN_NOME: admin
      ADMIN_EMAIL: admin@sistema-gleb.scrb.org.br
      ADMIN_SENHA: AdminGleb2026!
      ADMIN_ROLE: admin
      FRONTEND_URL: https://sistema-gleb.scrb.org.br
    networks:
      - scrb
      - gleb-network
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=scrb"
        - "traefik.http.routers.gleb-backend.rule=Host(`sistema-gleb.scrb.org.br`) && (PathPrefix(`/api`) || PathPrefix(`/uploads`))"
        - "traefik.http.routers.gleb-backend.entrypoints=websecure"
        - "traefik.http.routers.gleb-backend.tls=true"
        - "traefik.http.routers.gleb-backend.tls.certresolver=letsencryptresolver"
        - "traefik.http.services.gleb-backend.loadbalancer.server.port=3002"

  frontend:
    image: node:20-alpine
    working_dir: /app
    command: >
      sh -c "
      apk add --no-cache git &&
      git clone https://github.com/dihgomes/sistema_gleb.git /app/temp 2>/dev/null || true &&
      if [ -d /app/temp ]; then
        rm -rf /app/frontend /app/backend /app/node_modules &&
        mv /app/temp/* /app/ &&
        rm -rf /app/temp
      fi &&
      cd frontend &&
      npm install &&
      npm run build &&
      npx http-server dist -p 3000 -a 0.0.0.0 --proxy http://localhost:3000? -c-1
      "
    environment:
      VITE_API_URL: https://sistema-gleb.scrb.org.br
    networks:
      - scrb
      - gleb-network
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=scrb"
        - "traefik.http.routers.gleb-frontend.rule=Host(`sistema-gleb.scrb.org.br`)"
        - "traefik.http.routers.gleb-frontend.entrypoints=websecure"
        - "traefik.http.routers.gleb-frontend.tls=true"
        - "traefik.http.routers.gleb-frontend.tls.certresolver=letsencryptresolver"
        - "traefik.http.services.gleb-frontend.loadbalancer.server.port=3000"

volumes:
  postgres-data:
  uploads-data:

networks:
  gleb-network:
    driver: overlay
  scrb:
    external: true
